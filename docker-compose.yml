# Lume-LAN — docker compose(只含 lume-lan 看板; AdGuard 已迁到 Mac 宿主)
#
# 用法:
#   A) 宿主刷新数据 + 容器只 serve(推荐, arp 扫描必须宿主):
#        1) 宿主先跑一次 make scan + make router-fetch, 生成 .data/
#        2) make docker-up(docker compose up -d)→ 看板起来, 读挂载进来的 .data/
#      arp 快照宿主负责(make dev 的 60s 循环), 容器读快照出 API。
#
#   B) 容器内自刷新路由器(REFRESH=1, 打 ROUTER_HOST):
#        路由器/流量/终端在容器内循环更新; arp 快照仍靠宿主(容器无宿主网卡)。
#
# AdGuard Home(DNS 记录「谁访问了什么域名」)已迁出容器 → Mac 宿主 launchd 服务
#   (com.erishen.adguardhome, 见 ~/Library/LaunchAgents/ + ~/Applications/AdGuardHome/)。
#   原因: 容器发布端口会把所有入站 DNS NAT 成同一个网关 IP, AdGuard 看不到真实
#   设备, 看板「域名访问」永远只显示 1 客户端; 宿主直绑 53 保留真实客户端 IP。
#   起停: make adguard-up / adguard-down; 控制台 http://127.0.0.1:10095 (ADGUARD_PORT)。
#   家里设备 DNS「首选」指 <本机IP>:53(AdGuard)、「备用」填 223.5.5.5。
#
# 凭据/端口: compose 自动读当前目录 .env 做变量替换(ROUTER_PASS/WEBHOOK_URL 等不进镜像)。
#
# 网络: Mac 的 Docker Desktop 默认 NAT 通常能直达 192.168.3.1(你的路由器)。
#       若连不通, 改用 Linux host 网络: 在 services.lume-lan 加
#       network_mode: host(并去掉 ports), 且 REFRESH=1。

services:
  lume-lan:
    build: .
    image: lume-lan
    container_name: lume-lan
    restart: unless-stopped
    # 宿主侧发布端口走 DOCKER_PORT(默认 10091, >10000, 避开本地 make dev 的 8091);
    # 容器内 Lume 仍绑 8091。覆盖: make docker-run DOCKER_PORT=11091 或 export DOCKER_PORT。
    ports:
      - "${DOCKER_PORT:-10091}:8091"
    environment:
      # serve 侧
      LUME_BIND: "0.0.0.0"
      # 容器内自刷新路由器(=1 开, 打 ROUTER_HOST); arp 仍靠宿主
      REFRESH: "0"
      REFRESH_SECS: "60"
      # 路由器
      ROUTER_HOST: "192.168.3.1"
      ROUTER_USER: "admin"
      ROUTER_PASS: "${ROUTER_PASS:-}"   # 宿主 shell export 或 .env 提供, 不进镜像
      # 告警推送(容器内 REFRESH=1 时数据循环会评估告警; 不配则容器内只打印日志)
      WEBHOOK_URL: "${WEBHOOK_URL:-}"
      WEBHOOK_SECRET: "${WEBHOOK_SECRET:-}"
      # 局域网 Basic Auth: htpasswd 文件由 make docker-up 前的 .runtime/htpasswd 提供
      # (生成: htpasswd -c -b -B -C 12 .runtime/htpasswd admin <密码>)
      HTPASSWD_FILE: "/auth/htpasswd"
    volumes:
      # 宿主 make scan / make router-fetch 产出的快照; 容器读它出 /api/*
      - ./.data:/app/.data
      # 看板 Basic Auth 凭据(只读挂载, 不进镜像)
      - ./.runtime/htpasswd:/auth/htpasswd:ro
      # 可选: 路由凭据文件(若不用上面 ROUTER_PASS env)
      # - ./.env:/app/.env:ro
    # network_mode: host   # Linux host 网络(打不通 NAT 时启用, 并去掉 ports)
